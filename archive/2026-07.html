  var mk=await crypto.subtle.importKey('raw',dk.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  var msg=new Uint8Array(16+ct.length); msg.set(iv,0); msg.set(ct,16);
  return crypto.subtle.verify('HMAC',mk,tag,msg);
}
async function open(dk){
  var raw=b2u(B), iv=raw.slice(0,16), tag=raw.slice(16,48), ct=raw.slice(48);
  var mk=await crypto.subtle.importKey('raw',dk.slice(32,64),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  var msg=new Uint8Array(16+ct.length); msg.set(iv,0); msg.set(ct,16);
  if(!(await crypto.subtle.verify('HMAC',mk,tag,msg))) return false;
  var ek=await crypto.subtle.importKey('raw',dk.slice(0,32),{name:'AES-CTR'},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-CTR',counter:iv,length:64},ek,ct);
  var html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate'))).text();
  // หน้าแดชบอร์ดหลักมีหน้ารหัสเดิมของตัวเอง -- ผ่านด่านนี้แล้วจึงข้ามให้ ไม่ต้องใส่รหัสสองรอบ
  var BP='<scr'+'ipt>(function(){var o=document.getElementById("pw-overlay");if(o){o.style.display="none";var a=document.getElementById("app");if(a)a.style.display="block";}document.addEventListener("click",function(e){var t=e.target&&e.target.closest?e.target.closest("button,a,[onclick]"):null;if(t&&/ออกจากระบบ|logout/i.test((t.textContent||"")+(t.getAttribute("onclick")||""))){e.preventDefault();e.stopPropagation();try{localStorage.removeItem("'+KEY+'");}catch(x){}location.reload();}},true);})();</scr'+'ipt>';
  var bi=html.lastIndexOf('</body>'); html=bi>=0?html.slice(0,bi)+BP+html.slice(bi):html+BP;
  document.open(); document.write(html); document.close();
  return true;
}
