  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b2u(SALT),iterations:IT,hash:'SHA-256'},k,512));
}
function hx(u){return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');}
function uh(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u;}
var er=document.getElementById('er'), go=document.getElementById('go');
(async function(){try{var s=localStorage.getItem(KEY); if(s&&s.length===128){ if(await open(uh(s))) return; localStorage.removeItem(KEY);} }catch(e){} })();
document.getElementById('f').addEventListener('submit',async function(ev){ev.preventDefault(); er.textContent=''; go.disabled=true; go.textContent='กำลังเปิด…';
  var rem=document.getElementById('rm').checked;
  try{var dk=await derive(document.getElementById('pw').value);
    if(rem){ var ok=await check(dk); if(ok){ try{localStorage.setItem(KEY,hx(dk));}catch(e){} } }
    if(await open(dk)) return;
    er.textContent='รหัสไม่ถูกต้อง';
  }catch(e){er.textContent='เบราว์เซอร์นี้เปิดหน้าไม่ได้ ลองใช้ Chrome หรือ Safari เวอร์ชันล่าสุด';}
  go.disabled=false; go.textContent='เข้าสู่ระบบ';});
})();
