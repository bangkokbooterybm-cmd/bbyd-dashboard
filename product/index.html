<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>BBY Product Board</title>
<style>
/* Layout: one centred sign-in card on brand green with a faint scale grid */
:root{--green:#154734;--green2:#0e3423;--gold:#c9a24a;--gold-ink:#A07400;--card:#fffdf8;--ink:#1f2622;--mut:#6f6a5f;--line:#e3d9c4;--err:#b3261e;
--display:'Crimson Text',Georgia,serif;--body:'Cabin','Maitree',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:var(--green);color:var(--ink);font-family:var(--body);display:grid;place-items:center;
padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
background-image:radial-gradient(900px 500px at 80% -10%,rgba(201,162,74,.18),transparent 60%),
repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 2px,transparent 2px 38px),repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 34px)}
.card{color-scheme:light;width:min(380px,100%);background:var(--card);border-radius:20px;padding:34px 30px 28px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);display:grid;gap:18px;justify-items:center;text-align:center}
.lg{width:150px;height:auto}
h1{font-family:var(--display);font-weight:700;font-size:30px;margin:4px 0 0;color:var(--green);text-wrap:balance}
p{margin:0;color:var(--mut);font-size:14px}
form{display:grid;gap:12px;width:100%}
input[type=password]{font:inherit;font-size:16px;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);text-align:center}
input[type=password]:focus{outline:2px solid var(--gold);outline-offset:1px}
button{font:600 15px var(--body);padding:12px;border:0;border-radius:999px;background:var(--green);color:#fff;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[disabled]{opacity:.6;cursor:wait}
label.rm{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:var(--mut)}
.err{color:var(--err);font-size:13px;min-height:1.2em}
.foot{font-size:12px;color:var(--gold-ink)}
</style>
</head><body>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.i)},key,ub(P.d));
 const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;const keep=document.getElementById('rm').checked;go.disabled=true;go.textContent='กำลังเปิด…';err.textContent='';
 try{await open_(pw);try{if(keep)localStorage.setItem('bby_pb',pw)}catch(_){}}
 catch(x){go.disabled=false;go.textContent='เปิดดู';err.textContent='รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง';}
});
document.getElementById('rm').addEventListener('change',e=>{if(!e.target.checked)try{localStorage.removeItem('bby_pb')}catch(_){}});
(async()=>{let s=null;try{s=localStorage.getItem('bby_pb')}catch(_){}if(s){try{await open_(s)}catch(_){try{localStorage.removeItem('bby_pb')}catch(__){}}}})();
})();
</script>
