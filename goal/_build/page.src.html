<style>

  --good:#6FCB92; --good-bg:#1D3727; --orng:#F0955A; --orng-bg:#3F2616; --ylw:#E2C24E; --ylw-bg:#3A3212; --warn:#E3B45A; --warn-bg:#3A2F17; --bad:#EE8B79; --bad-bg:#3D211C;

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:0 48px}

@media (max-width:560px){.vcal .vb.ok::after{content:none}.vcal{gap:2px}.vcal .day{min-height:58px;padding:3px 2px;gap:2px}.vcal .vb{font-size:9px;padding:0 1px;border-width:0 0 0 2px;border-radius:2px;text-overflow:clip;letter-spacing:-.02em}.vcal .dn{font-size:11px}}
.sheet{border:1px solid var(--line);border-radius:14px;padding:0;width:min(760px,calc(100% - 24px));max-height:86vh;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

<script>
(() => {
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const YEAR=2026, ym=m=>`${YEAR}-${String(m).padStart(2,'0')}`;
const SHEETS={audit:'1rqwdmccSqz60tEG039A77ivkc-ZW06fHw2dkO0klunY',demand:'1GI-TUQoQc3p5bHVmA_CsLvz_Ae23mSpdJWxJCO1cQIQ',sales:'1UjO_8Upfe2grXg0F2QcCrtM13md-60st629LD-zh7aE',staff:'1yE7oALXvKcKhP3U75C_vzq6BcGSi4XR4JBLApP5W8mM'};
const PEOPLE_FROM='2026-06'; // audit / visit / exam / demand records start in June 2026
const DEFAULT_ALIASES={'กิ้ฟ':['กุ๊บกิ๊บ','กิ๊ฟ','กุ้บกิ้ฟ'],'ญาญ่า':['ญ่า','ญา']};
const DRIVE='Google Drive';
const MAIN=GSProc.MAIN, TYPE_LABEL={L:'Lady',M:'Men',S:'Shop'};
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v] of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}return e;};
const fmt=(n,d=0)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n,d=1)=>n==null||!isFinite(n)?'–':(n*100).toFixed(d)+'%';
const thDate=s=>{if(!s)return '–';const[y,m,d]=s.split('-').map(Number);return `${d} ${MONTHS[m-1]} ${y}`;};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const nameKey=s=>String(s||'').replace(/\(.*?\)/g,'').replace(/^คุณ/,'').replace(/[\u0E48-\u0E4B\u0E4C]/g,'').replace(/[\u0E38\u0E39]+/g,'\u0E38').replace(/\s+/g,'').trim(); // ignore tone marks: กิ้ฟ = กิ๊ฟ, ตูุ๊กตา = ตุ๊กตา
function aliasMap(){const out={};const add=(c,list)=>(list||[]).forEach(a=>{const k=nameKey(a);if(k&&k!==nameKey(c))out[k]=c;});
  Object.entries(DEFAULT_ALIASES).forEach(([c,l])=>add(c,l));Object.entries(cfg().aliases||{}).forEach(([c,l])=>add(c,l));return out;}
const rosterKeys=r=>{const am=aliasMap(),own=nameKey(r.name);return [own,...(r.aliases||[]).map(nameKey),...Object.keys(am).filter(k=>nameKey(am[k])===own)].filter(Boolean);};
function canonOf(sc,ro){const k=nameKey(sc);const r=ro.find(x=>rosterKeys(x).includes(k));if(r)return nameKey(r.name);const am=aliasMap();return am[k]?nameKey(am[k]):k;}

const S={auditSub:store.get('gs2.auditSub')||'cov',scope:store.get('gs2.scope')||'BKK',month:Number(store.get('gs2.month'))||(new Date().getFullYear()===YEAR?new Date().getMonth()+1:9),tab:store.get('gs2.tab')||'overview',
  config:null,monthly:{},team:{},audit:null,demand:null,sales:null,staff:null,stocks:[],db:null,user:null,mcp:null,canAdmin:false,openBr:{}};
const DEFAULT_CFG={supervisors:[{scope:'SENIOR',title:'Supervisor'},{scope:'BKK',title:'Supervisor BKK'},{scope:'UPC',title:'Supervisor UPC'}],roster:[],focus:[],discountPeriods:[],liveTargets:{}};
const cfg=()=>S.config||DEFAULT_CFG;
const sup=()=>cfg().supervisors.find(s=>s.scope===S.scope)||{};
const mainIn=scope=>Object.keys(MAIN).filter(k=>scope==='SENIOR'||MAIN[k].s===scope);
// Senior Supervisor (คุณโอ๋): sales + focus = whole country; audit = own evaluations of BKK SCs; visit KPI = BKK branches (UPC visits shown, not counted)
const isSr=()=>S.scope==='SENIOR';
const team=()=>isSr()?'BKK':S.scope;
const SR_KEY='โอ'; // nameKey of คุณโอ๋
// whose audits/visits count on each board: Supervisor = คุณโอ๋, Supervisor BKK = คุณเอ, Supervisor UPC = คุณโบว์ (only UPC evaluator kept by the parser)
const EV_KEY={SENIOR:'โอ',BKK:'เอ'};
const SUP_NAME={SENIOR:'คุณโอ๋',BKK:'คุณเอ',UPC:'คุณโบว์'};
const evOK=ev=>!EV_KEY[S.scope]||nameKey(ev)===EV_KEY[S.scope];
const salesScopes=()=>isSr()?['BKK','UPC']:[S.scope];
// Who is on a team in a month: from the HR sheet (nickname + work location). Out from the month they resign, whatever the day.
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);};
const GRACE=14; // new staff are evaluated after 14 days; no sales form for more than 14 days = left
// Merge the HR sheet with the daily sales form. Each person: {name, scope, fromYM, untilYM|null, note}
function mergedPeople(){
  if(!S.staff)return null;
  const am=aliasMap(),form=S.sales?.sc||[],months=Object.values(S.sales?.months||{}),dataLast=months.map(m=>m.lastDate).sort().pop()||null;
  const key=(n,sc)=>nameKey(n)+'|'+sc,fk={};form.forEach(f=>{if(f.scope)fk[key(am[nameKey(f.name)]||f.name,f.scope)]=f;});
  const used=new Set(),out=[],seen=new Set();
  const decide=(name,scope,start,end,left,f,src)=>{
    const k=key(name,scope);if(seen.has(k))return;seen.add(k);
    let until=null,note='';
    const gone=f&&dataLast&&f.last<addDays(dataLast,-GRACE);
    if(end&&f&&f.last>end){note=`ชีทพนักงานลงลาออก ${end} แต่ยังส่งยอดถึง ${f.last}`;if(gone){until=f.last.slice(0,7);note+=' แล้วหายไป';}}
    else if(end)until=end.slice(0,7);
    else if(left||gone){if(f){until=f.last.slice(0,7);note=left?`ลาออกไม่มีวันที่ ส่งยอดล่าสุด ${f.last}`:`ไม่ส่งยอดตั้งแต่ ${f.last} ถือว่าออก`;}else{until='0000-00';note='ลาออกไม่มีวันที่ และไม่มีในฟอร์มส่งยอด';}}
    const ov=(cfg().leftOverride||{})[name];
    if(ov){until=ov;note=`ตั้งค่าว่าออกแล้ว เดือน ${MONTHS[+ov.slice(5)-1]}`;}
    const st=start||f?.first||null;
    out.push({name,scope,fromYM:st?addDays(st,GRACE).slice(0,7):null,untilYM:until,note,src});
  };
  S.staff.people.forEach(p=>{if(am[nameKey(p.name)])return;const f=fk[key(p.name,p.scope)];if(f)used.add(f);decide(p.name,p.scope,p.start,p.end,p.left,f,'HR');});
  form.forEach(f=>{if(used.has(f)||!f.scope||am[nameKey(f.name)])return;decide(f.name,f.scope,null,null,false,f,'form');});
  return out;
}
// Who is on a team in a month. Out from the month they leave, whatever the day; in once they pass 14 days.
function rosterFor(scope,ymk){
  const mp=mergedPeople();
  if(!mp)return cfg().roster.filter(r=>r.scope===scope&&r.active!==false);
  return mp.filter(p=>p.scope===scope&&(!p.fromYM||p.fromYM<=ymk)&&(!p.untilYM||p.untilYM>ymk)).map(p=>({name:p.name,scope}));
}
const rosterIn=()=>rosterFor(team(),curYM());
const peopleOK=()=>curYM()>=PEOPLE_FROM;
const otherScope=()=>team()==='BKK'?'UPC':'BKK';
const curYM=()=>ym(S.month);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3000);}
function banner(m){const b=$('#banner');b.hidden=!m;b.textContent=m||'';}
function tone(v,g,w){if(v==null||!isFinite(v))return '';return v>=g?'good':v>=w?'warn':'bad';}
function barEl(v){const b=el('div',{class:'bar'});const i=el('i');i.style.width=Math.max(0,Math.min(1,v||0))*100+'%';b.append(i);return b;}
const stampTxt=(label,ts)=>el('div',{class:'stamp'},label,' ',el('b',{},ts?(()=>{const d=new Date(ts);return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;})():'ยังไม่เคยอัปเดต'));

/* ---------- derived data ---------- */
function liveTarget(ymk,scope){const lt=(cfg().liveTargets||{})[ymk];const L=S.sales?.months?.[ymk];if(!lt||lt[scope]==null)return null;
  const n=L?.eventsWithSales||0,mine=L?.[scope]?.eventsWithSales||0;return lt[scope]+(n&&lt.event?lt.event*mine/n:0);}
function rowFor(scope,m){const id=ym(m),d=S.monthly[`${scope}-${id}`]||{},L=S.sales?.months?.[id]?.[scope];
  if(!d.closed&&L)return {m,live:true,asOf:S.sales.months[id].lastDate,sales:L.sales,target:d.target??liveTarget(id,scope),disc:d.disc??null,eventDays:L.eventDays,events:L.events.map(e=>({code:e.code,days:e.days}))};
  return {m,sales:d.sales??null,target:d.target??null,disc:d.disc??null,eventDays:d.eventDays??null,events:d.events||[]};}
function salesRows(){const r=[];for(let m=1;m<=12;m++){const parts=salesScopes().map(sc=>rowFor(sc,m));if(parts.length===1){r.push(parts[0]);continue;}
  const sum=k=>parts.every(p=>p[k]!=null)?parts.reduce((a,p)=>a+p[k],0):null;
  r.push({m,live:parts.some(p=>p.live),asOf:parts.map(p=>p.asOf).filter(Boolean).sort().pop(),sales:sum('sales'),target:sum('target'),disc:null,eventDays:sum('eventDays'),events:parts.flatMap(p=>p.events||[])});}
  return r;}
function salesStats(){
  const rows=salesRows(),upto=rows.filter(r=>r.m<=S.month),have=upto.filter(r=>r.sales!=null&&r.target&&!r.live); // YTD / average use closed months only
  const ytdS=have.reduce((a,r)=>a+r.sales,0),ytdT=have.reduce((a,r)=>a+r.target,0),achs=have.map(r=>r.sales/r.target),cur=rows[S.month-1];
  return {rows,cur,ytdAll:upto.reduce((x,r)=>x+(r.sales||0),0),lastClosed:have.length?have[have.length-1].m:null,curAch:cur.sales!=null&&cur.target?cur.sales/cur.target:null,ytdS,ytdT,ytdAch:ytdT?ytdS/ytdT:null,avgAch:achs.length?achs.reduce((a,b)=>a+b,0)/achs.length:null,nMonths:achs.length,evYTD:upto.reduce((a,r)=>a+(r.eventDays||0),0),evCur:cur.eventDays};
}
// Every Sup's audits of this team's SCs (company rule: coverage counts whoever evaluated)
function auditsTeamAll(){if(!peopleOK())return [];const mine=new Set(rosterIn().flatMap(rosterKeys)),other=new Set(rosterFor(otherScope(),curYM()).flatMap(rosterKeys));
  return (S.audit?.audits||[]).filter(a=>a.scope===team()&&a.ym===curYM()&&!a.x&&!(other.has(nameKey(a.sc))&&!mine.has(nameKey(a.sc))));}
const evShort=ev=>String(ev||'').replace(/^คุณ/,'');
function teamCoverage(){
  const recs=auditsTeamAll(),ro=rosterIn(),evs=[...new Set(recs.map(a=>evShort(a.ev)))].sort();
  const rows=ro.map(r=>{const k=nameKey(r.name),mine=recs.filter(a=>canonOf(a.sc,ro)===k),by={};mine.forEach(a=>{const e=evShort(a.ev);by[e]=(by[e]||0)+1;});return {name:r.name,n:mine.length,by};});
  rows.sort((a,b)=>a.n-b.n||a.name.localeCompare(b.name,'th'));
  const cnt=f=>rows.filter(f).length;
  return {recs,rows,evs,z:cnt(r=>!r.n),one:cnt(r=>r.n===1),two:cnt(r=>r.n===2),three:cnt(r=>r.n>=3)};
}
function auditsMonth(){if(!peopleOK())return [];const mine=new Set(rosterIn().flatMap(rosterKeys)),other=new Set(rosterFor(otherScope(),curYM()).flatMap(rosterKeys));
  return (S.audit?.audits||[]).filter(a=>a.scope===team()&&a.ym===curYM()&&!a.x&&evOK(a.ev)&&!(other.has(nameKey(a.sc))&&!mine.has(nameKey(a.sc))));} // skip SCs of the other team
function visitsMonth(){if(!peopleOK())return [];return (S.audit?.visits||[]).filter(v=>v.scope===team()&&v.ym===curYM()&&evOK(v.ev)&&(isSr()||!v.x));}
function auditStats(){
  const recs=auditsMonth(),ro=rosterIn(),by={};
  recs.forEach(a=>{const k=canonOf(a.sc,ro);(by[k]=by[k]||[]).push(a);});
  const known=new Set(ro.flatMap(rosterKeys));
  const unknown=[...new Set(recs.map(a=>a.sc).filter(s=>!known.has(nameKey(s))))];
  const c1=ro.filter(r=>(by[nameKey(r.name)]||[]).length>=1).length,c2=ro.filter(r=>(by[nameKey(r.name)]||[]).length>=2).length;
  const sc=recs.map(a=>a.avg).filter(v=>v!=null);
  return {recs,ro,by,c1,c2,unknown,avg:sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null};
}
function visitStats(){
  const all=visitsMonth(),recs=all.filter(v=>!v.x),extra=all.filter(v=>v.x),br=mainIn(team()),by={};recs.forEach(v=>{const k=v.br||v.brRaw;by[k]=(by[k]||0)+1;});
  const total=br.reduce((a,b)=>a+(by[b]||0),0);
  return {recs,all,extra,br,by,visited:br.filter(b=>by[b]).length,total,avg:br.length?total/br.length:null,visitOnly:recs.filter(v=>!v.audits).length,other:recs.filter(v=>!v.br||!MAIN[v.br]).length};
}
function examStats(){
  const recs=auditsMonth().filter(a=>a.exam!=null);const per={};
  const ro=rosterIn();recs.forEach(a=>{const k=canonOf(a.sc,ro);const r=ro.find(x=>nameKey(x.name)===k);(per[k]=per[k]||{name:r?r.name:a.sc,vals:[]}).vals.push(a.exam);});
  const people=Object.values(per).map(p=>({name:p.name,avg:p.vals.reduce((a,b)=>a+b,0)/p.vals.length,n:p.vals.length}));
  return {recs,people,avg:people.length?people.reduce((a,p)=>a+p.avg,0)/people.length:null,pass:people.filter(p=>p.avg>=4).length};
}
function demandStats(){const recs=peopleOK()?(S.demand?.rows||[]).filter(r=>r.ym===curYM()) /* shared target: โอ๋ + เอ + โบว์ together */:[];return {recs,times:recs.length,qty:recs.reduce((a,r)=>a+(r.qty||0),0),done:recs.filter(r=>r.done).length};}
function stockFor(){
  const end=`${curYM()}-31`;const list=S.stocks.filter(s=>s.stockDate&&s.stockDate<=end).sort((a,b)=>b.stockDate.localeCompare(a.stockDate));
  const s=list[0]||null;return s?{s,inMonth:s.stockDate.startsWith(curYM())}:null;
}
function focusStats(){
  const f=stockFor();if(!f)return null;const br=mainIn(S.scope).map(k=>({code:k,...f.s.branches[k]})).filter(b=>b.req);
  const avg=br.length?br.reduce((a,b)=>a+b.ok/b.req,0)/br.length:null;
  return {f,br,avg,pass:br.filter(b=>b.ok/b.req>=0.9).length};
}

/* ---------- header / tabs ---------- */
const PRE_TXT='เริ่มบันทึกตั้งแต่ มิ.ย. 2569';
const TABS=[['overview','Overview'],['sales','Sales & Events'],['audit','SC Audit'],['visit','Visit'],['focus','Focus Product'],['demand','Product Demand'],['team','SC Exam / All Star']];
function renderHeader(){
  const seg=$('#scopeSeg');seg.replaceChildren();
  cfg().supervisors.forEach(s=>seg.append(el('button',{type:'button','aria-pressed':String(s.scope===S.scope),onclick:()=>{S.scope=s.scope;store.set('gs2.scope',s.scope);render();}},s.title)));
  const sel=$('#monthSel');if(!sel.options.length){MONTHS.forEach((m,i)=>sel.append(el('option',{value:i+1},`${m} ${YEAR}`)));sel.addEventListener('change',()=>{S.month=+sel.value;store.set('gs2.month',sel.value);render();});}
  sel.value=S.month;$('#title').textContent=sup().title||'Supervisor';
  const t=$('#tabs');t.replaceChildren();const list=TABS.slice();if(S.canAdmin)list.push(['manager','Manager'],['settings','Settings']);
  const cur=list.some(x=>x[0]===S.tab)?S.tab:'overview'; // settings appears once admin rights are known; keep the saved tab meanwhile
  list.forEach(([k,l])=>t.append(el('button',{role:'tab','aria-selected':String(k===cur),onclick:()=>go(k)},l)));
}
function go(k){S.tab=k;store.set('gs2.tab',k);render();window.scrollTo({top:0});}

/* ---------- Overview ---------- */
// o = {code, w, name, big, tone, cap, rows:[[label,value,tone?]], rule, bar, tab}
function kpi(o){
  const rows=(o.rows||[]).filter(Boolean);
  return el('article',{class:'kpi'},el('div',{class:'head'},el('span',{class:'code'},o.code),el('span',{class:'w'},`น้ำหนัก ${o.w}`)),el('div',{class:'name'},o.name),
    el('div',{class:'big num '+(o.tone||'')},o.big),o.cap?el('div',{class:'cap'},o.cap):null,o.bar||null,
    rows.length?el('dl',{class:'rows'},...rows.flatMap(([k,v,t])=>k?[el('dt',{},k),el('dd',{class:t||null},v)]:[el('dd',{class:'note'},v)])):null,
    // criteria text intentionally not shown: the board reports results only, no scoring
o.tab?el('button',{class:'go',type:'button',onclick:()=>go(o.tab)},'ดูรายละเอียด →'):null);
}
const tn=(v,g,w)=>v==null||!isFinite(v)?'none':v>=g?'good':v>=w?'warn':'bad';
