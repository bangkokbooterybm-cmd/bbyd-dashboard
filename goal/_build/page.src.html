<title>Supervisor Goal Board 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F3EF; --surface:#FFFFFF; --sunk:#E7EBE4; --line:#D5DBD1; --ink:#17211C; --ink2:#4A5750; --ink3:#6F7B73;
  --accent:#2F6B4F; --accent-soft:#DCEBE2; --brass:#8A6A1F; --brass-bg:#F3EAD2;
  --good:#2E7D4F; --good-bg:#DDF0E3; --orng:#C2571A; --orng-bg:#FBE3D3; --ylw:#A88408; --ylw-bg:#F6EDC6; --warn:#9A6A0C; --warn-bg:#F7EBCF; --bad:#B3412F; --bad-bg:#F6DEDA;
  --shadow:0 1px 2px rgba(23,33,28,.06),0 4px 14px rgba(23,33,28,.05);
  --c-sales:#2E7D4F; --c-event:#B07A0A; --c-demand:#13867F; --c-focus:#C2571A; --c-visit:#2F6FB0; --c-audit:#7A4FB5; --c-exam:#B8860B; --c-mgr:#8A6A1F; --c-pass:#2F6B4F;
  --disp:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#111613; --surface:#18201B; --sunk:#202A24; --line:#2E3A33; --ink:#E4EAE5; --ink2:#AEBAB2; --ink3:#8A968E;
  --accent:#6FBF95; --accent-soft:#1F3A2C; --brass:#D9B866; --brass-bg:#3A3018;
  --good:#6FCB92; --good-bg:#1D3727; --orng:#F0955A; --orng-bg:#3F2616; --ylw:#E2C24E; --ylw-bg:#3A3212; --warn:#E3B45A; --warn-bg:#3A2F17; --bad:#EE8B79; --bad-bg:#3D211C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-sales:#6FCB92; --c-event:#E2C24E; --c-demand:#4FC7BE; --c-focus:#F0955A; --c-visit:#7FB2EE; --c-audit:#B79AE8; --c-exam:#E2C24E; --c-mgr:#D9B866; --c-pass:#7CC79F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111613; --surface:#18201B; --sunk:#202A24; --line:#2E3A33; --ink:#E4EAE5; --ink2:#AEBAB2; --ink3:#8A968E;
  --accent:#6FBF95; --accent-soft:#1F3A2C; --brass:#D9B866; --brass-bg:#3A3018;
  --good:#6FCB92; --good-bg:#1D3727; --orng:#F0955A; --orng-bg:#3F2616; --ylw:#E2C24E; --ylw-bg:#3A3212; --warn:#E3B45A; --warn-bg:#3A2F17; --bad:#EE8B79; --bad-bg:#3D211C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-sales:#6FCB92; --c-event:#E2C24E; --c-demand:#4FC7BE; --c-focus:#F0955A; --c-visit:#7FB2EE; --c-audit:#B79AE8; --c-exam:#E2C24E; --c-mgr:#D9B866; --c-pass:#7CC79F;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:14px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)} .small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-top:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--ink2);font:600 13px var(--body);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-bottom:-1px}
.tabs button{flex:none;border:0;background:none;padding:9px 12px;font:600 13px var(--body);color:var(--ink3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);font:600 13px var(--body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)} .btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:760px}
.pick button{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:var(--shadow)}
.pick button:hover,.pick button:focus-visible{border-color:var(--accent);outline:none}
.pick b{font-size:16px}.pick span{font-size:13px;color:var(--ink3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.stamp{font-size:12px;color:var(--ink3)}
.stamp b{color:var(--ink2);font-weight:600}
.score{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:420px){.score{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.kpi .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.kpi .code{font:600 12px var(--disp);color:var(--accent)} .kpi .w{font-size:11px;color:var(--ink3);background:var(--sunk);padding:1px 7px;border-radius:99px}
.kpi .name{font:600 14px var(--disp)} .kpi .big{font:700 30px var(--disp);line-height:1.1;color:var(--ink)}
.kpi .big.good{color:var(--good)} .kpi .big.warn{color:var(--warn)} .kpi .big.bad{color:var(--bad)} .kpi .big.live{color:var(--ink)} .kpi .big.none{color:var(--ink3)}
.kpi .cap{font-size:11px;color:var(--ink3);margin-top:-4px}
.kpi .rows{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}
.kpi .rows dt{color:var(--ink3)} .kpi .rows dd{margin:0;text-align:right;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .rows dd.note{grid-column:1/-1;text-align:left;color:var(--ink3);font-weight:500} .kpi .rows dd.good{color:var(--good)} .kpi .rows dd.warn{color:var(--warn)} .kpi .rows dd.bad{color:var(--bad)} .kpi .rows dd.mute{color:var(--ink3);font-weight:500}
.kpi .rule{font-size:11px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:6px}
.kpi button.go{align-self:flex-start;border:0;background:none;color:var(--accent);font:600 12px var(--body);padding:0;cursor:pointer}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ex{background:var(--brass-bg);color:var(--brass)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden} .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600;background:var(--sunk)}
th:first-child,td:first-child{text-align:left} td.l,th.l{text-align:left}
tr.cur td{background:var(--accent-soft)} tr.tot td{font-weight:600;border-top:2px solid var(--line)}
td.wrap{display:table-cell;max-width:none;margin:0;white-space:normal;min-width:200px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink3);font:11px var(--body)} .chart .lbl{fill:var(--ink2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.chip b{font-family:var(--disp)}
.chip.good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.chip.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.chip.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.chip.ex{border-color:var(--brass);background:var(--brass-bg);color:var(--brass)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink3)}
.key{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.key::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.key.good{color:var(--good)} .key.warn{color:var(--warn)} .key.bad{color:var(--bad)}
details.au{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.au+details.au,.au+.au{margin-top:6px}
.au.plain{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vis .sumrow,details.au.vis summary{display:grid;grid-template-columns:100px 160px 80px 1fr 100px;gap:10px;align-items:center;padding:9px 12px;font-size:13px}
.vis .sumrow>:nth-child(4),details.au.vis summary>:nth-child(4){justify-self:start}
.vis .cnt{color:var(--accent);font-weight:600;text-align:right} .vis .cnt.none{color:var(--ink3);font-weight:400}
@media (max-width:560px){.vis .sumrow,details.au.vis summary{grid-template-columns:80px 1fr auto}.vis .hide-s{display:none}}
details.au summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:92px minmax(90px,1.2fr) 70px minmax(70px,1fr) auto;gap:10px;align-items:center;padding:9px 12px;font-size:13px}
details.au summary::-webkit-details-marker{display:none}
details.au[open] summary{border-bottom:1px solid var(--line)}
details.au .body{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
details.au h4{margin:0 0 6px;font:600 12px var(--body);letter-spacing:.03em;display:flex;justify-content:space-between}
details.au ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13px}
details.au li{display:flex;justify-content:space-between;gap:10px}
details.au li b{font-family:var(--disp);min-width:18px;text-align:right}
.s-hi{color:var(--good)} .s-lo{color:var(--bad)}
.notes{grid-column:1/-1;font-size:13px;display:flex;flex-direction:column;gap:4px}
@media (max-width:560px){details.au summary{grid-template-columns:80px 1fr auto}details.au summary .hide-s{display:none}}
.vcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.vcal .dow{font-size:11px;font-weight:600;color:var(--ink3);text-align:center;letter-spacing:.04em;padding:2px 0}
.vcal .dow.we{color:var(--brass)}
.vcal .day{min-height:76px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.vcal .day.blank{background:transparent;border-style:dashed;opacity:.45}
.vcal .day.has{background:var(--accent-soft);border-color:var(--accent)}
.vcal .day.today{outline:2px solid var(--accent);outline-offset:-1px}
.vcal .dn{font:600 12px var(--disp);color:var(--ink3)} .vcal .day.has .dn{color:var(--accent)}
:is(.vcal,.vlg) .vb{font:600 11px var(--disp);padding:1px 5px;border-radius:5px;background:var(--surface);color:var(--ink);border:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:is(.vcal,.vlg) .vb.ok{background:var(--good);border-color:var(--good);color:var(--surface)} :is(.vcal,.vlg) .vb.ok::after{content:' ✓'} :is(.vcal,.vlg) .vb.ex{border-color:var(--brass);color:var(--brass);background:var(--brass-bg)}
.vcal .day.off{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.vcal .day.off .dn{color:var(--bad)}
.vcal .offt{font-size:10px;font-weight:600;color:var(--bad);letter-spacing:.02em}
.vlg .vli{display:inline-flex;align-items:center;gap:6px}
:is(.vcal,.vlg) .vb.nt{border-style:dashed;border-color:var(--accent);color:var(--accent);background:var(--surface)}
.pill.nt{background:transparent;border:1px dashed var(--accent);color:var(--accent);padding:1px 6px}
.vbr{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
:is(.vcal,.vlg) .vb.oth{border-style:dashed;border-color:var(--ink3);color:var(--ink2);background:var(--sunk)}
@media (max-width:560px){.vcal .vb.ok::after{content:none}.vcal{gap:2px}.vcal .day{min-height:58px;padding:3px 2px;gap:2px}.vcal .vb{font-size:9px;padding:0 1px;border-width:0 0 0 2px;border-radius:2px;text-overflow:clip;letter-spacing:-.02em}.vcal .dn{font-size:11px}}
.sheet{border:1px solid var(--line);border-radius:14px;padding:0;width:min(760px,calc(100% - 24px));max-height:86vh;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sheet::backdrop{background:rgba(10,16,13,.45)}
.sh-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sh-body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.trend{display:flex;gap:6px;align-items:flex-end;min-height:64px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:34px}
.tcol i{display:block;width:22px;border-radius:4px 4px 0 0;background:var(--ink3);opacity:.45}
.tcol.cur i{opacity:1} .tcol i.good{background:var(--good)} .tcol i.warn{background:var(--warn)} .tcol i.bad{background:var(--bad)}
.tcol .tv{font:600 11px var(--disp);color:var(--ink2)} .tcol .tm{font-size:10px;color:var(--ink3)} .tcol.cur .tm{color:var(--ink);font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tcard{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.act{gap:8px}
.actrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 12px;border-radius:10px;border-left:4px solid var(--line);background:var(--sunk)}
.actrow>span.small{grid-column:1} .actrow .go{grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-weight:600;font-size:12px}
.actrow.bad{border-left-color:var(--bad);background:var(--bad-bg)} .actrow.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.actrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.subtabs{align-self:flex-start;flex-wrap:wrap}
td.cm{background:var(--accent-soft)}
.dl{font:600 12px var(--disp);white-space:nowrap} .dl.up{color:var(--good)} .dl.down{color:var(--bad)} .dl.flat,.dl.none{color:var(--ink3)}
.scsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.scsum .grp{border-radius:10px;padding:10px 12px;border-left:4px solid}
.scsum h4{margin:0 0 6px;font:600 13px var(--body)}
.scsum ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.scsum li{display:flex;justify-content:space-between;gap:10px;align-items:center}
tr.asb td{background:var(--bad-bg)}
.lhero{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(135deg,var(--surface),var(--brass-bg))}
.lh-l{display:flex;gap:16px;align-items:center}
.trophy{width:110px;flex:none} .trophy svg{width:100%;height:auto;display:block} .trophy.sm{width:44px}
.champ{font:700 30px var(--disp);line-height:1.1} .champ-s{font:700 20px var(--disp);color:var(--brass)}
.pill.lt{background:var(--sunk);color:var(--ink2);font-size:10px;padding:1px 6px}
.podium{display:grid;grid-template-columns:repeat(3,110px);gap:8px;align-items:end}
.pod{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:13px}
.pod b{font:700 14px var(--disp)} .pod .step{width:100%;border-radius:8px 8px 0 0;margin-top:4px}
.pod.p1 .step{height:70px;background:linear-gradient(#F6D77A,#B88A24)} .pod.p2 .step{height:48px;background:linear-gradient(#E4E7EA,#9AA3AB)} .pod.p3 .step{height:34px;background:linear-gradient(#E8B98C,#A0643A)}
.medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:700 13px var(--disp);color:#2A1C00;background:#E2B84A;border:2px solid #8A6414}
.pod.p2 .medal,.medal.m2{background:#D5DADF;border-color:#7E878F;color:#1F262C} .pod.p3 .medal,.medal.m3{background:#E3A877;border-color:#8A5228;color:#2C1708}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.award{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--sunk);border-top:4px solid var(--brass)}
.award.off{cursor:default;opacity:.6} .aw-t{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--brass)} .aw-n{font:700 20px var(--disp)} .aw-v{font:600 13px var(--disp);color:var(--good)}
.tbattle{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.tb{background:var(--sunk);border-radius:12px;padding:12px 14px;border:2px solid transparent} .tb.lead{border-color:var(--good);background:var(--good-bg)}
.tb-h{display:flex;justify-content:space-between;align-items:center} .tb-v{font:700 26px var(--disp)} .vs{font:700 16px var(--disp);color:var(--ink3)}
.ltable td{vertical-align:middle} .lrk{width:44px} .lsc{min-width:180px} .lsc .num{display:inline-block;width:64px;font-weight:600}
.lbar{display:inline-block;vertical-align:middle;width:calc(100% - 72px);min-width:60px;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden} .lbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
tr.ltop td{background:color-mix(in srgb,var(--brass-bg) 60%,transparent)} tr.lbot td{background:color-mix(in srgb,var(--bad-bg) 55%,transparent)} tr.lbot .lbar i{background:var(--bad)}
.hof{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.hofc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--sunk)} .hofc.cur{background:var(--brass-bg);outline:1px solid var(--brass)}
@media (max-width:560px){.podium{grid-template-columns:repeat(3,1fr);width:100%}.lh-l{width:100%}.trophy{width:84px}.champ{font-size:24px}.tbattle{grid-template-columns:1fr}.vs{text-align:center}}
/* ---- colour per section (League style) ---- */
#view{--tc:var(--accent)}

function swatchCss(name){const n=String(name||'').toLowerCase();if(/multi|painted|glitter galaxy|modo/.test(n))return 'conic-gradient(#c0392b,#f1c40f,#2e8b57,#2f6fb0,#7b4fa6,#c0392b)';
  const one=t=>{const w=t.trim().split(/\s+/);let c=null;for(let i=w.length-1;i>=0&&!c;i--)c=SW[w[i]]||(w[i]==='blue'&&w[i-1]==='royal'?SW.royal:null);if(!c)return '#bdb8ae';
    if(/light|pastel|baby/.test(t))return `color-mix(in srgb,${c} 55%,#fff)`;if(/dark|deep/.test(t))return `color-mix(in srgb,${c} 65%,#000)`;return c;};
